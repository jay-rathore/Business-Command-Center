name: hpl-command-center

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      target: dev
    env_file: ../.env
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../apps/backend:/app/apps/backend
      - ../packages/shared:/app/packages/shared
      - backend_node_modules:/app/apps/backend/node_modules
      # apps/backend/.env is written for native dev (DATABASE_URL points at the host-mapped
      # port) and dotenv loads it with override:true in main.ts, so it always wins over the
      # bind-mounted directory above — shadow it with the Docker-network variant instead.
      - ../apps/backend/.env.docker.local:/app/apps/backend/.env:ro

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      target: dev
    env_file: ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000
    ports:
      - "3005:3005"
    depends_on:
      - backend
    volumes:
      - ../apps/frontend:/app/apps/frontend
      - ../packages/shared:/app/packages/shared
      - frontend_node_modules:/app/apps/frontend/node_modules

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pg_data:
  backend_node_modules:
  frontend_node_modules:
